<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Quản Lý Kho 365 - Vận Tải 365</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2897/2897785.png" type="image/png">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1e3a8a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        iframe { width: 100%; height: 100%; border: none; display: block; position: relative; z-index: 2; }
        .loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; color: white; z-index: 1;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: #facc15;
            animation: spin 0.8s linear infinite; margin: 0 auto 10px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <div>Đang tải Hệ Thống Kho Vật Tư 365...</div>
    </div>
    <iframe 
        src="https://script.google.com/macros/s/AKfycbxHnUmp2zNAJ96O9EKPaDKnN8AQdRvqUQQHNgBWosA7T7K6_7eNTFIQZM34fDkostgm/exec" 
        allowfullscreen="true">
    </iframe>
</body>
</html>
