<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Cấu hình chuẩn responsive hiển thị full màn hình điện thoại & máy tính -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Hệ Thống Quản Lý Kho 365 - Vận Tải 365</title>
    
    <!-- Favicon biểu tượng kho vật tư / linh kiện xe chuyên nghiệp -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2897/2897785.png" type="image/png">

    <style>
        /* Ép khung nhúng (iframe) full 100% màn hình, không viền, chống giật cuộn */
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e3a8a; /* Màu xanh nhận diện thương hiệu Vận Tải 365 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: relative;
            z-index: 2;
        }
        
        /* Hiệu ứng loading xoay tròn chuyên nghiệp lúc chờ Google Script tải */
        .loading-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 1;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #facc15; /* Màu vàng điểm nhấn */
            animation: spin 0.8s ease-in-out infinite;
            margin: 0 auto 12px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <!-- Màn hình chờ lúc Google Apps Script đang tải -->
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Đang tải Hệ Thống Kho Vật Tư 365...</div>
    </div>

    <!-- Khung nhúng ứng dụng Google Apps Script Kho 365 -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbxHnUmp2zNAJ96O9EKPaDKnN8AQdRvqUQQHNgBWosA7T7K6_7eNTFIQZM34fDkostgm/exec" 
        allowfullscreen="true"
        loading="lazy">
    </iframe>
</body>
</html>
